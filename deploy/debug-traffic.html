<!DOCTYPE html>
<html>
<head>
    <title>Traffic Counter Debug</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #0f0; padding: 20px; }
        .success { color: #0f0; }
        .error { color: #f00; }
        .warning { color: #ff0; }
        .info { color: #0ff; }
        pre { background: #000; padding: 10px; border: 1px solid #333; overflow-x: auto; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; }
        button:hover { background: #0a0; }
    </style>
</head>
<body>
    <h1>🔍 Traffic Counter Debug Tool</h1>
    <p class="info">This page tests the traffic counter integration</p>
    
    <div>
        <button onclick="testAPI()">Test API Connection</button>
        <button onclick="testPost()">Test POST Request</button>
        <button onclick="checkLocalStorage()">Check LocalStorage</button>
        <button onclick="simulateVisit()">Simulate Visit</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        const API_URL = './traffic-api.php';
        const results = document.getElementById('results');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        async function testAPI() {
            log('<h2>Testing API Connection...</h2>', 'info');
            try {
                const response = await fetch(API_URL);
                log(`Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const data = await response.json();
                    log('<pre>' + JSON.stringify(data, null, 2) + '</pre>', 'success');
                } else {
                    const text = await response.text();
                    log(`<pre>${text}</pre>`, 'error');
                }
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
                log('Make sure traffic-api.php is uploaded to the server!', 'warning');
            }
        }
        
        async function testPost() {
            log('<h2>Testing POST Request...</h2>', 'info');
            const testData = {
                visitorId: 'debug_' + Date.now(),
                timestamp: new Date().toISOString()
            };
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });
                
                log(`Status: ${response.status}`, response.ok ? 'success' : 'error');
                
                const data = await response.json();
                log('<pre>' + JSON.stringify(data, null, 2) + '</pre>', response.ok ? 'success' : 'error');
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
            }
        }
        
        function checkLocalStorage() {
            log('<h2>Checking LocalStorage...</h2>', 'info');
            const visitorId = localStorage.getItem('cyberkit_visitor_id');
            const trafficData = localStorage.getItem('cyberkit_traffic');
            
            if (visitorId) {
                log(`✅ Visitor ID: ${visitorId}`, 'success');
            } else {
                log('⚠️ No visitor ID found', 'warning');
            }
            
            if (trafficData) {
                try {
                    const data = JSON.parse(trafficData);
                    log('<pre>' + JSON.stringify(data, null, 2) + '</pre>', 'info');
                } catch (e) {
                    log(`❌ Invalid JSON: ${e.message}`, 'error');
                }
            } else {
                log('⚠️ No traffic data in localStorage', 'warning');
            }
        }
        
        async function simulateVisit() {
            log('<h2>Simulating Visit...</h2>', 'info');
            
            // Check if traffic-counter.js is loaded
            if (typeof initTrafficCounter === 'function') {
                log('✅ traffic-counter.js is loaded', 'success');
                log('Calling initTrafficCounter()...', 'info');
                initTrafficCounter();
                setTimeout(() => {
                    log('Visit recorded! Check console for details.', 'success');
                }, 1000);
            } else {
                log('❌ traffic-counter.js is NOT loaded!', 'error');
                log('Make sure the script is included in your HTML', 'warning');
            }
        }
        
        // Auto-run API test on load
        window.addEventListener('load', () => {
            setTimeout(testAPI, 500);
        });
    </script>
</body>
</html>
